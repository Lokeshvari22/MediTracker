{% extends "base.html" %}

{% block title %}
Sign Up | MediTracker
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6 col-md-8">

        <div class="card shadow-lg border-0">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <i class="fa-solid fa-user-plus text-success fa-3x"></i>

                    <h2 class="mt-3">

                        Create Account

                    </h2>

                    <p class="text-muted">

                        Register to access MediTracker

                    </p>

                </div>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Username

                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter Username"
                            required
                            minlength="3">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Email Address

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter Email"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter Password"
                            required
                            minlength="6">

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Confirm Password

                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm Password"
                            required
                            minlength="6">

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg">

                            <i class="fa-solid fa-user-check"></i>

                            Create Account

                        </button>

                    </div>

                </form>

                <hr>

                <div class="text-center">

                    <p>

                        Already have an account?

                    </p>

                    <a
                        href="{{ url_for('auth.login') }}"
                        class="btn btn-outline-success">

                        Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
