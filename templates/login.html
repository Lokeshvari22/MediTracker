{% extends "base.html" %}

{% block title %}
Login | MediTracker
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-5 col-md-7">

        <div class="card shadow-lg border-0">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <i class="fa-solid fa-capsules text-success fa-3x"></i>

                    <h2 class="mt-3">

                        MediTracker

                    </h2>

                    <p class="text-muted">

                        Login to continue

                    </p>

                </div>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Email Address

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg">

                            <i class="fa-solid fa-right-to-bracket"></i>

                            Login

                        </button>

                    </div>

                </form>

                <hr>

                <div class="text-center">

                    <p>

                        Don't have an account?

                    </p>

                    <a
                        href="{{ url_for('auth.signup') }}"
                        class="btn btn-outline-success">

                        Create Account

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
