{% extends "base.html" %}

{% block title %}
Add Purchase | MediTracker
{% endblock %}

{% block content %}

<div class="container mt-4 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="fa-solid fa-cart-plus me-2"></i>Add New Inventory Purchase
                    </h4>
                </div>

                <div class="card-body p-4">

                    <form method="POST" action="{{ url_for('purchase.add_purchase') }}">

                        <div class="row g-4">

                            <!-- Purchase Information -->
                            <div class="col-md-6">
                                <h5 class="fw-bold border-bottom pb-2 text-dark">
                                    <i class="fa-solid fa-file-invoice me-2 text-success"></i>Purchase Details
                                </h5>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Invoice / Bill Number <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           class="form-control"
                                           name="invoice_number"
                                           placeholder="e.g. PUR-2026-0001"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Purchase Date <span class="text-danger">*</span>
                                    </label>
                                    <input type="date"
                                           class="form-control"
                                           id="purchaseDate"
                                           name="purchase_date"
                                           value="{{ today or '' }}"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Supplier <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select"
                                            name="supplier_id"
                                            required>
                                        <option value="" disabled selected>Select Supplier...</option>
                                        {% for supplier in suppliers %}
                                        <option value="{{ supplier.id }}">
                                            {{ supplier.name or supplier.company_name }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <!-- Medicine Details -->
                            <div class="col-md-6">
                                <h5 class="fw-bold border-bottom pb-2 text-dark">
                                    <i class="fa-solid fa-pills me-2 text-success"></i>Medicine Item
                                </h5>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Medicine <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select"
                                            id="medicineSelect"
                                            name="medicine_id"
                                            required>
                                        <option value="" disabled selected>Select Medicine Item...</option>
                                        {% for medicine in medicines %}
                                        <option value="{{ medicine.id }}"
                                                data-batch="{{ medicine.batch_number }}"
                                                data-price="{{ medicine.price }}">
                                            {{ medicine.name }} (Batch: {{ medicine.batch_number }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Batch Number
                                    </label>
                                    <input type="text"
                                           id="batchNumber"
                                           class="form-control bg-light"
                                           placeholder="Auto-populated"
                                           readonly>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Purchase Unit Price (₹) <span class="text-danger">*</span>
                                    </label>
                                    <input type="number"
                                           step="0.01"
                                           class="form-control"
                                           id="unitPrice"
                                           name="purchase_price"
                                           placeholder="0.00"
                                           min="0"
                                           required>
                                </div>
                            </div>

                        </div>

                        <hr class="my-4">

                        <!-- Quantity and Adjustment Breakdown -->
                        <h5 class="fw-bold text-dark mb-3">
                            <i class="fa-solid fa-calculator me-2 text-success"></i>Quantity & Line Calculations
                        </h5>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Quantity <span class="text-danger">*</span>
                                </label>
                                <input type="number"
                                       class="form-control"
                                       id="quantity"
                                       name="quantity"
                                       min="1"
                                       placeholder="Units received"
                                       required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Discount Amount (₹)
                                </label>
                                <input type="number"
                                       class="form-control"
                                       id="discount"
                                       name="discount"
                                       value="0"
                                       min="0"
                                       step="0.01">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    GST Rate (%)
                                </label>
                                <input type="number"
                                       class="form-control"
                                       id="gst"
                                       name="gst"
                                       value="0"
                                       min="0"
                                       step="0.1">
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Payment & Final Amount -->
                        <h5 class="fw-bold text-dark mb-3">
                            <i class="fa-solid fa-credit-card me-2 text-success"></i>Payment & Financial Breakdown
                        </h5>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Payment Method</label>
                                <select class="form-select" name="payment_method">
                                    <option value="Cash">Cash</option>
                                    <option value="UPI">UPI</option>
                                    <option value="Card">Card</option>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                    <option value="Credit">Credit / Account</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Calculated Total Amount (₹)
                                </label>
                                <input type="number"
                                       step="0.01"
                                       class="form-control bg-light fw-bold text-success fs-5"
                                       id="totalAmount"
                                       name="total_amount"
                                       placeholder="0.00"
                                       readonly>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Payment Status</label>
                                <select class="form-select" name="status">
                                    <option value="Paid">Paid</option>
                                    <option value="Pending">Pending</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4 mb-4">
                            <label class="form-label fw-semibold">Remarks / Internal Notes</label>
                            <textarea class="form-control"
                                      rows="3"
                                      name="notes"
                                      placeholder="Add purchase details or supplier delivery batch reference..."></textarea>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('purchase.purchases') }}" class="btn btn-secondary px-4">
                                <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                            </a>

                            <button type="submit" class="btn btn-success px-4">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Save Purchase Record
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const medicineSelect = document.getElementById("medicineSelect");
    const batchNumber = document.getElementById("batchNumber");
    const unitPrice = document.getElementById("unitPrice");
    const quantity = document.getElementById("quantity");
    const discount = document.getElementById("discount");
    const gst = document.getElementById("gst");
    const totalAmount = document.getElementById("totalAmount");
    const purchaseDate = document.getElementById("purchaseDate");

    // Set today's date if empty
    if (purchaseDate && !purchaseDate.value) {
        purchaseDate.value = new Date().toISOString().split('T')[0];
    }

    medicineSelect.addEventListener("change", function () {
        const option = this.options[this.selectedIndex];
        batchNumber.value = option.dataset.batch || "";
        if (!unitPrice.value || parseFloat(unitPrice.value) === 0) {
            unitPrice.value = option.dataset.price || "";
        }
        calculateTotal();
    });

    [quantity, unitPrice, discount, gst].forEach(input => {
        if (input) {
            input.addEventListener("input", calculateTotal);
        }
    });

    function calculateTotal() {
        const qty = parseFloat(quantity.value) || 0;
        const price = parseFloat(unitPrice.value) || 0;
        const disc = parseFloat(discount.value) || 0;
        const gstRate = parseFloat(gst.value) || 0;

        let subtotal = qty * price;
        subtotal = Math.max(0, subtotal - disc);
        const finalTotal = subtotal + (subtotal * (gstRate / 100));

        totalAmount.value = finalTotal.toFixed(2);
    }
});
</script>
{% endblock %}

{% endblock %}
